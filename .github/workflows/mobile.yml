name: Mobile

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NOTO_JP_URL: https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 500M

      - name: Fetch Japanese font
        continue-on-error: true
        run: |
          mkdir -p fonts
          curl -fsSL --retry 3 -o fonts/NotoSansJP-Regular.ttf "$NOTO_JP_URL"

      - name: Pick NDK and CMake
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          CMAKE_VER=$(ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null | sort -V | tail -n1)
          echo "NDK_VER=$(basename "$NDK_DIR")" >> "$GITHUB_ENV"
          echo "CMAKE_VER=${CMAKE_VER:-3.22.1}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          gradle assembleRelease --build-cache --parallel \
            -Pth06NdkVersion=$NDK_VER \
            -Pth06CmakeVersion=$CMAKE_VER \
            -Pth06Abis=arm64-v8a 2>&1 | tee ../build.log

      - name: Report errors
        if: failure()
        run: |
          grep -nE "error|Error|FAILED|What went wrong|undefined" build.log | grep -vE "warning|SDL_error|GameErrorContext|error\.(c|h)" | head -n 40 > errors.txt || true
          tail -n 25 build.log >> errors.txt || true
          split -l 6 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error::$msg"
          done

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk th06-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: th06-android
          path: th06-android-arm64.apk
          compression-level: 0

  ios:
    name: iOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-arm64
          max-size: 500M

      - name: Fetch Japanese font
        continue-on-error: true
        run: |
          mkdir -p fonts
          curl -fsSL --retry 3 -o fonts/NotoSansJP-Regular.ttf "$NOTO_JP_URL"

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache 2>&1 | tee build.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ios --target th06 --parallel 2>&1 | tee -a build.log

      - name: Report errors
        if: failure()
        run: |
          grep -nE "error|Error|FAILED|What went wrong|undefined" build.log | grep -vE "warning|SDL_error|GameErrorContext|error\.(c|h)" | head -n 40 > errors.txt || true
          tail -n 25 build.log >> errors.txt || true
          split -l 6 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error::$msg"
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build-ios/th06.app Payload/
          codesign --force --sign - --timestamp=none Payload/th06.app || true
          zip -qry th06-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: th06-ios
          path: th06-ios.ipa
          compression-level: 0

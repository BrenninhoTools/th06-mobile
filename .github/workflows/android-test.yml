name: Android Test

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        working-directory: android
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          CMAKE_VER=$(ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null | sort -V | tail -n1)
          gradle assembleRelease -Pth06NdkVersion=$(basename "$NDK_DIR") -Pth06CmakeVersion=${CMAKE_VER:-3.22.1} -Pth06Abis=x86_64,arm64-v8a

      - name: Inspect native libraries
        run: |
          mkdir -p apk && cd apk && unzip -q ../android/app/build/outputs/apk/release/app-release.apk
          LLVM=$(ls -d "${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"/toolchains/llvm/prebuilt/*/bin | head -n1)
          for abi in arm64-v8a x86_64; do
            echo "== $abi" >> ../native.txt
            ls -la lib/$abi >> ../native.txt
            "$LLVM/llvm-readelf" -d lib/$abi/libmain.so | grep NEEDED >> ../native.txt
            "$LLVM/llvm-nm" -D --defined-only lib/$abi/libmain.so | grep -E " SDL_main$|JNI_OnLoad| Java_" | head -n 5 >> ../native.txt
          done

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/emulator-test.sh

      - name: Report
        if: always()
        run: |
          report() {
            [ -f "$1" ] || return 0
            split -l 45 "$1" "part_$2_"
            for f in part_$2_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::$3::$msg"
            done
          }
          report native.txt native notice
          report logcat-setup.txt setup warning
          report logcat-game.txt game error
